name: MovilCam Android

on:
  push:
    paths:
      - 'MovilCam/**'
      - '.github/workflows/movilcam-android.yml'
  pull_request:
    paths:
      - 'MovilCam/**'
      - '.github/workflows/movilcam-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform/build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug APK
        working-directory: MovilCam
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MovilCam-Android-debug
          path: MovilCam/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
